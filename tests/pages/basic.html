<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Basic</title>
  <style>
    .hidden { display: none; }
    .invis { visibility: hidden; }
    .zero { width: 0; height: 0; padding: 0; border: 0; overflow: hidden; }
    .transparent { opacity: 0; }
    #far { margin-top: 2000px; }
  </style>
</head>
<body>
  <h1>Basic page</h1>
  <p>Plain text is not interactive.</p>
  <a href="/about" id="about">About us</a>
  <a id="noref">Anchor without href</a>
  <button id="go">Go</button>
  <button id="icon" aria-label="Close dialog"><svg width="10" height="10"><rect width="10" height="10"/></svg></button>
  <button id="dis" disabled>Disabled</button>

  <label for="email">Email</label>
  <input id="email" type="email" placeholder="you@example.com" required>
  <label>Password <input id="pw" type="password" value="secret123"></label>
  <input type="hidden" name="csrf" value="token">
  <label for="country">Country</label>
  <select id="country"><option>Israel</option><option selected>UK</option><option>USA</option></select>
  <input type="checkbox" id="tos" checked><label for="tos">I agree</label>
  <textarea id="msg" placeholder="Message"></textarea>
  <input type="submit" value="Send">

  <button class="hidden">HiddenDisplay</button>
  <button class="invis">HiddenVisibility</button>
  <button class="zero">Zero</button>
  <button class="transparent">Transparent</button>
  <div style="display:none"><button>InsideHidden</button></div>
  <div style="opacity:0"><button>InsideTransparent</button></div>

  <button id="far">Far below</button>
</body>
</html>
