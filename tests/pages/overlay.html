<html>
<head><meta charset="utf-8"><title>Overlay</title></head>
<body>

  <div id="backdrop" style="position:fixed;inset:0;background:rgba(0,0,0,.5)">
    <div style="margin:200px;background:white;padding:20px">
      <p>Accept cookies?</p>
      <button id="ok">OK</button>
    </div>
  </div>
