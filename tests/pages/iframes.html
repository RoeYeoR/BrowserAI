<!doctype html>
<html>
<head><meta charset="utf-8"><title>Iframes</title></head>
<body style="margin:0">
  <button>Top button</button>
  <iframe id="inline" style="position:absolute;left:100px;top:300px;width:400px;height:200px;border:0"
          srcdoc="<body style='margin:0'><button style='margin:10px'>Frame button</button><input placeholder='Frame input'></body>"></iframe>
  <iframe id="child" src="frame_child.html"
          style="position:absolute;left:600px;top:300px;width:300px;height:200px;border:0"></iframe>
  <iframe style="display:none" srcdoc="<button>Hidden frame button</button>"></iframe>
</body>
</html>
