<!doctype html>
<html>
<head><meta charset="utf-8"><title>Shadow DOM</title></head>
<body>
  <button>Light button</button>
  <my-widget></my-widget>
  <script>
    customElements.define("inner-widget", class extends HTMLElement {
      constructor() {
        super();
        this.attachShadow({ mode: "open" }).innerHTML = `<a href="#deep">Deep link</a>`;
      }
    });
    customElements.define("my-widget", class extends HTMLElement {
      constructor() {
        super();
        this.attachShadow({ mode: "open" }).innerHTML = `
          <button id="sbtn">Shadow button</button>
          <label for="sin">Shadow label</label><input id="sin">
          <inner-widget></inner-widget>`;
      }
    });
  </script>
</body>
</html>
